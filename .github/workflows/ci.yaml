name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint .

      # serverName and an external Postgres are required, so CI passes obviously
      # fake values to get a render for default validation.
      - name: Helm template (monolith, the fork's whole point)
        run: |
          helm template synapse . \
            --set serverName=ci.example.com \
            --set externalPostgresql.host=pg.invalid \
            --set externalPostgresql.username=ci \
            --set externalPostgresql.password=ci-not-for-prod \
            > /tmp/monolith.yaml

      # The fork exists so a 0-worker monolith needs no Redis. If a rebase onto
      # upstream ever reintroduces the unconditional redis block, this fails.
      - name: Assert a monolith renders no redis config
        run: |
          if grep -qE '^    redis:' /tmp/monolith.yaml; then
            echo "::error::monolith render contains a redis block; the fork patch has regressed" >&2
            grep -n -A3 '^    redis:' /tmp/monolith.yaml >&2
            exit 1
          fi
          echo "OK: no redis block in the monolith render"

      # The other half of the patch: enabling a worker must restore upstream
      # behaviour, including requiring externalRedis.
      - name: Helm template (worker mode)
        run: |
          helm template synapse . \
            --set serverName=ci.example.com \
            --set externalPostgresql.host=pg.invalid \
            --set externalPostgresql.username=ci \
            --set externalPostgresql.password=ci-not-for-prod \
            --set workers.appservice.enabled=true \
            --set externalRedis.host=redis.invalid \
            > /tmp/workers.yaml
          grep -qE '^    redis:' /tmp/workers.yaml || {
            echo "::error::worker render is missing the redis block; upstream behaviour was not preserved" >&2
            exit 1
          }
          echo "OK: redis block present in worker mode"

      # The fork removes the bitnami subcharts. If a rebase reintroduces them,
      # `helm template` would start needing `helm dependency build` again.
      - name: Assert no bitnami references
        run: |
          # Strip the file:line: prefix before deciding if it is a comment,
          # otherwise every explanatory comment trips this check.
          if grep -rniE 'bitnami' Chart.yaml values.yaml templates/ \
               | sed -E 's/^[^:]+:[0-9]+://' \
               | grep -vE '^\s*#' | grep -q .; then
            echo "::error::bitnami reference found; the fork removed those deliberately" >&2
            exit 1
          fi
          echo "OK: no bitnami references"

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate templates
        run: |
          kubeconform -strict -ignore-missing-schemas < /tmp/monolith.yaml
          kubeconform -strict -ignore-missing-schemas < /tmp/workers.yaml

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Guards against cutting a tag without bumping Chart.yaml, which would
      # republish the previous chart version over itself.
      - name: Package chart
        run: |
          chart_version=$(helm show chart . | awk '/^version:/ {print $2}')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml version $chart_version does not match tag $tag_version" >&2
            exit 1
          fi
          helm package .

      - name: Push to OCI registry
        run: helm push matrix-synapse-*.tgz oci://ghcr.io/itsh-cloud/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
