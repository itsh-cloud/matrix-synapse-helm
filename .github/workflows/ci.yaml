name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint .

      # serverName and an external Postgres are required, so CI passes obviously
      # fake values to get a render for default validation.
      - name: Helm template (monolith)
        run: |
          helm template synapse . \
            --set serverName=ci.example.com \
            --set externalPostgresql.host=pg.invalid \
            --set externalPostgresql.username=ci \
            --set externalPostgresql.password=ci-not-for-prod \
            > /tmp/monolith.yaml

      # A 0-worker monolith must need no Redis. This is the behaviour the chart
      # exists to provide, so it is asserted rather than assumed.
      - name: Assert a monolith renders no redis config
        run: |
          if grep -qE '^    redis:' /tmp/monolith.yaml; then
            echo "::error::monolith render contains a redis block; the fork patch has regressed" >&2
            grep -n -A3 '^    redis:' /tmp/monolith.yaml >&2
            exit 1
          fi
          echo "OK: no redis block in the monolith render"

      # A monolith must not reference a redis Secret either. Gating the config
      # block alone was not enough: the REDIS_PASSWORD env is gated separately,
      # so the chart once rendered a secretKeyRef to a Secret nothing else
      # needed, and deleting that Secret took three homeservers down with
      # CreateContainerConfigError.
      - name: Assert a monolith references no redis Secret
        run: |
          if grep -q 'name: REDIS_PASSWORD' /tmp/monolith.yaml; then
            echo "::error::monolith render has a REDIS_PASSWORD secretKeyRef; it will reference a Secret that need not exist" >&2
            exit 1
          fi
          echo "OK: no redis Secret reference in the monolith render"

      # And the other direction: with a worker enabled, Redis is required again,
      # because that is when Synapse actually uses it for replication.
      - name: Helm template (worker mode)
        run: |
          helm template synapse . \
            --set serverName=ci.example.com \
            --set externalPostgresql.host=pg.invalid \
            --set externalPostgresql.username=ci \
            --set externalPostgresql.password=ci-not-for-prod \
            --set workers.appservice.enabled=true \
            --set externalRedis.host=redis.invalid \
            > /tmp/workers.yaml
          grep -qE '^    redis:' /tmp/workers.yaml || {
            echo "::error::worker render is missing the redis block; upstream behaviour was not preserved" >&2
            exit 1
          }
          echo "OK: redis block present in worker mode"

      # The render MUST be byte-identical across runs. Upstream defaulted
      # registration_shared_secret to randAlphaNum, so every render differed:
      # under a GitOps controller that rolled the pods on unrelated commits and
      # silently rotated the secret on every sync.
      - name: Assert the render is deterministic
        run: |
          for i in 1 2; do
            helm template synapse . \
              --set serverName=ci.example.com \
              --set externalPostgresql.host=pg.invalid \
              --set externalPostgresql.username=ci \
              --set externalPostgresql.password=ci-not-for-prod \
              --set config.registrationSharedSecretExistingSecret=ci-reg \
              | sha256sum | cut -d' ' -f1 >> /tmp/hashes
          done
          if [ "$(sort -u /tmp/hashes | wc -l)" != "1" ]; then
            echo "::error::render is not deterministic; something regenerates on each render" >&2
            cat /tmp/hashes >&2
            exit 1
          fi
          echo "OK: render is deterministic"

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate templates
        run: |
          kubeconform -strict -ignore-missing-schemas < /tmp/monolith.yaml
          kubeconform -strict -ignore-missing-schemas < /tmp/workers.yaml

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Guards against cutting a tag without bumping Chart.yaml, which would
      # republish the previous chart version over itself.
      - name: Package chart
        run: |
          chart_version=$(helm show chart . | awk '/^version:/ {print $2}')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml version $chart_version does not match tag $tag_version" >&2
            exit 1
          fi
          helm package .

      - name: Push to OCI registry
        run: helm push matrix-synapse-*.tgz oci://ghcr.io/itsh-cloud/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
