---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrix-synapse.fullname" . }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    {{- if .Values.config.recaptcha }}
    ## Captcha ##

    recaptcha_private_key: {{ .Values.config.recaptcha.privateKey | quote }}
    {{- end }}
    {{- if .Values.config.turnSecret }}

    ## Turn ##

    turn_shared_secret: {{ .Values.config.turnSecret | quote }}

    {{- end }}
    ## Registration ##

{{/*
  ITSH FORK CHANGE: upstream defaulted this to `randAlphaNum 24`, which is
  regenerated on EVERY render. Under ArgoCD that means every new git revision
  produces a different Secret, a different checksum/secrets annotation and
  therefore a pod roll, on commits that have nothing to do with this chart. It
  also means the shared secret itself silently changes on every sync, so
  anything using it is broken by design.

  With registrationSharedSecretExistingSecret set, the rendered config carries a
  constant placeholder instead and the real value is substituted at startup from
  an env var, exactly as this chart already does for POSTGRES_PASSWORD. The
  render is then deterministic and the secret stays out of git.
*/}}
{{- if .Values.config.registrationSharedSecretExistingSecret }}
    registration_shared_secret: "@@REGISTRATION_SHARED_SECRET@@"
{{- else }}
    registration_shared_secret: {{ .Values.config.registrationSharedSecret | default (randAlphaNum 24) | quote }}
{{- end }}

    ## API Configuration ##

    {{- if .Values.config.macaroonSecretKey }}

    macaroon_secret_key: {{ .Values.config.macaroonSecretKey | quote }}
    {{- end }}

{{- $postgresHost := include "matrix-synapse.postgresql.host" . }}
{{- $postgresDB   := include "matrix-synapse.postgresql.database" . }}
{{- $postgresUser := include "matrix-synapse.postgresql.username" . }}
{{- $postgresPort := include "matrix-synapse.postgresql.port" . }}
{{- $postgresPass := include "matrix-synapse.postgresql.password" . }}
{{- $postgresSSLMode := include "matrix-synapse.postgresql.sslmode" . }}
{{- $postgresExtraArgs := include "matrix-synapse.postgresql.extraArgs" . }}

    ## Database configuration ##

    database:
      name: "psycopg2"
      args:
        user: {{ $postgresUser | quote }}
        {{- if and $postgresPass (not .Values.postgresql.auth.existingSecret) }}
        password: {{ $postgresPass | quote }}
        {{- else }}
        password: "@@POSTGRES_PASSWORD@@"
        {{- end }}
        database: {{ $postgresDB | quote }}
        host: {{ $postgresHost | quote }}
        port: {{ $postgresPort }}
        sslmode: {{ $postgresSSLMode | quote }}
        cp_min: 5
        cp_max: 10
        {{- $postgresExtraArgs | nindent 8 }}

{{/*
  ITSH FORK CHANGE. Synapse only needs Redis for worker replication; a monolith
  with no workers does not use it. Upstream renders the redis block
  unconditionally and the redis.host helper hard-fails without either
  redis.enabled or externalRedis.host, so a 0-worker deployment was forced to
  run a Redis it never used.

  The whole block below is now gated on whether any worker is enabled, using the
  same idiom the chart already uses in worker-configuration.yaml. With no
  enabled workers the chart renders no redis config, the helper is never
  evaluated, and no Redis is required. Enable a worker and the upstream
  behaviour returns unchanged.
*/}}
{{- $anyWorker := false }}
{{- range $worker, $config := .Values.workers }}
  {{- if $config.enabled }}
    {{- $anyWorker = true }}
  {{- end }}
{{- end }}
{{- if $anyWorker }}
{{- $redisHost := include "matrix-synapse.redis.host" . }}
{{- $redisPort := include "matrix-synapse.redis.port" . }}
{{- $redisPass := include "matrix-synapse.redis.password" . }}
{{- $redisDbid := include "matrix-synapse.redis.dbid" . }}
{{- $redisTls  := or (and .Values.redis.enabled .Values.redis.tls .Values.redis.tls.enabled) (and (not .Values.redis.enabled) .Values.externalRedis.tls) }}

    ## Redis configuration ##

    redis:
      enabled: true
      host: {{ $redisHost | quote }}
{{- if $redisPort }}
      port: {{ $redisPort }}
{{- end }}
{{- if or .Values.redis.auth.enabled .Values.redis.usePassword .Values.redis.password .Values.redis.auth.password .Values.externalRedis.password }}
  {{- if and $redisPass (not .Values.redis.auth.existingSecret) }}
      password: {{ $redisPass | quote }}
  {{- else }}
      password: "@@REDIS_PASSWORD@@"
  {{- end }}
{{- end }}
{{- if $redisDbid }}
      dbid: {{ $redisDbid }}
{{- end }}
{{- if $redisTls }}
      use_tls: true
{{- end }}
{{- end }}{{/* ITSH FORK CHANGE: closes `if $anyWorker` above */}}

    {{- with .Values.extraSecrets }}

    ## Extra secrets ##
    {{ . | toYaml | nindent 4 }}
    {{- end }}
